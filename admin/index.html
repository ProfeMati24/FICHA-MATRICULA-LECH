<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Matrículas</title>
<link rel="icon" type="image/png" href="../BD_CARGABLE/logo.png">
<!-- Tema propio del admin (clave distinta a la del formulario) -->
<script>
  (function(){
    var t = localStorage.getItem("charme-tema");
    if (t) document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login">
  <div class="login-card">
    <h1><i data-lucide="shield"></i> Panel Admin</h1>
    <p>Liceo Eduardo Charme · Matrículas</p>
    <input type="password" id="pwd" class="login-input" maxlength="8" placeholder="••••" autofocus>
    <button class="login-btn" id="btn-login"><i data-lucide="log-in"></i> Entrar</button>
    <div class="login-error" id="login-error">Contraseña incorrecta</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="admin" id="admin">
  <header class="topbar">
    <h1>
      <span class="topbar-logo">
        <img src="../BD_CARGABLE/logo.png" alt="Logo Liceo Eduardo Charme" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
        <i data-lucide="layout-dashboard" style="display:none;"></i>
      </span>
      Panel de Administración
    </h1>
    <div class="spacer"></div>
    <a class="btn" href="../index.html"><i data-lucide="arrow-left"></i> Formulario</a>
    <button class="btn" id="btn-visualizar" title="Ver datos por pestañas y páginas tipo libro Excel">
      <i data-lucide="table-2"></i> Visualizar Tablas
    </button>
    <button class="btn" id="btn-gestionar" title="Ver y eliminar años guardados">
      <i data-lucide="archive"></i> Gestionar años
    </button>
    <button class="btn" id="btn-manual" title="Leer el manual de usuario">
      <i data-lucide="book-open"></i> Manual
    </button>
    <button class="btn" id="btn-excel" title="Descarga todos los postulantes en un .xlsx">
      <i data-lucide="file-spreadsheet"></i> Excel global
    </button>
    <!-- Botón de cambio de modo (claro/oscuro) -->
    <button class="btn" id="btn-tema" title="Cambiar tema claro/oscuro">
      <i data-lucide="moon"></i>
    </button>
    <button class="btn btn-peligro" id="btn-salir" title="Salir"><i data-lucide="log-out"></i></button>
  </header>

  <main class="main">
    <!-- Filtros -->
    <section class="panel">
      <div class="panel-head"><i data-lucide="filter"></i> Postulantes</div>
      <div class="panel-body">
        <div class="filtros">
          <div class="campo">
            <label>Buscar</label>
            <input type="text" id="f-buscar" placeholder="Nombre, RUT, fono…">
          </div>
          <div class="campo">
            <label>Año</label>
            <select id="f-anio"><option value="">Todos</option></select>
          </div>
          <div class="campo">
            <label>Establecimiento</label>
            <select id="f-establecimiento"><option value="">Todos</option></select>
          </div>
          <div class="campo">
            <label>Estado</label>
            <select id="f-estado"><option value="">Todos</option></select>
          </div>
          <button class="btn" id="btn-limpiar-filtros" title="Limpiar filtros"><i data-lucide="x"></i></button>
        </div>
        <div class="contador" id="contador">—</div>
      </div>
    </section>

    <!-- Tabla -->
    <section class="panel">
      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>N°</th><th>Año</th><th>Alumno</th><th>RUT</th>
              <th>Establecimiento</th><th>Estado</th><th>Creado</th><th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="m-titulo">Detalle</h2>
      <button class="btn" id="m-cerrar"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body" id="m-body"></div>
    <div class="modal-foot">
      <button class="btn btn-peligro" id="m-eliminar"><i data-lucide="trash-2"></i> Eliminar</button>
      <button class="btn" id="m-editar" style="margin-right:auto"><i data-lucide="pencil"></i> Editar</button>
      <button class="btn" id="m-cerrar-2">Cerrar</button>
      <button class="btn" id="m-pdf"><i data-lucide="file-text"></i> Descargar PDF</button>
      <button class="btn btn-primario" id="m-guardar" disabled><i data-lucide="save"></i> Guardar cambios</button>
    </div>
  </div>
</div>

<!-- Botón de tema del admin (guarda en charme-tema) -->
<script>
  (function(){
    var root = document.documentElement;
    var btn = document.getElementById("btn-tema");
    if (!btn) return;
    function estaOscuro(){
      return root.getAttribute("data-theme") === "dark" ||
        (!root.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
    }
    function pintarIcono(){
      btn.innerHTML = estaOscuro() ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
      if (window.lucide) lucide.createIcons();
    }
    btn.addEventListener("click", function(){
      var nuevo = estaOscuro() ? "light" : "dark";
      root.setAttribute("data-theme", nuevo);
      localStorage.setItem("charme-tema", nuevo);
      pintarIcono();
    });
    pintarIcono();
  })();
</script>

<!-- Ventana del visualizador de tablas (iframe) -->
<div class="visor-bg" id="visor">
  <div class="visor">
    <div class="visor-head">
      <h2><i data-lucide="table-2"></i> Visualizar Tablas</h2>
      <button class="btn" id="visor-cerrar" title="Cerrar"><i data-lucide="x"></i></button>
    </div>
    <iframe id="visor-frame" class="visor-frame" title="Visualizar tablas"></iframe>
  </div>
</div>

<!-- Ventana de gestión de años (iframe) -->
<div class="visor-bg" id="gestor">
  <div class="visor">
    <div class="visor-head">
      <h2><i data-lucide="archive"></i> Gestionar años</h2>
      <button class="btn" id="gestor-cerrar" title="Cerrar"><i data-lucide="x"></i></button>
    </div>
    <iframe id="gestor-frame" class="visor-frame" title="Gestionar años"></iframe>
  </div>
</div>

<!-- Ventana del manual de usuario (iframe) -->
<div class="visor-bg" id="manual">
  <div class="visor">
    <div class="visor-head">
      <h2><i data-lucide="book-open"></i> Manual de usuario</h2>
      <button class="btn" id="manual-cerrar" title="Cerrar"><i data-lucide="x"></i></button>
    </div>
    <iframe id="manual-frame" class="visor-frame" title="Manual de usuario"></iframe>
  </div>
</div>

<!-- Scripts clásicos (sin type="module") para doble clic -->
<script src="../ScriptBD.js"></script>
<script src="admin.js"></script>
</body>
</html>
